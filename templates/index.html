<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Speed Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a, #020617);
            color: white;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .btn-glow {
            background: linear-gradient(135deg, #6366f1, #06b6d4);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-glow:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.6);
        }
        .btn-glow:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .speed-circle {
            border: 8px solid rgba(255, 255, 255, 0.05);
            border-top: 8px solid #06b6d4;
        }
        .animate-spin-slow {
            animation: spin 3s linear infinite;
        }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="max-w-4xl w-full px-4 py-12">
        <div class="text-center mb-10">
            <h1 class="text-5xl font-bold mb-3">Test your <span class="text-blue-400">connection.</span></h1>
            <p class="text-slate-400">Real-time stats from your browser to our Python backend.</p>
        </div>

        <div class="glass-card rounded-[2.5rem] p-10 mb-8 flex flex-col items-center">
            <div class="relative w-72 h-72 flex items-center justify-center rounded-full mb-8 speed-circle" id="circle">
                <div class="text-center">
                    <span id="main-speed" class="text-7xl font-bold tracking-tighter">0.00</span>
                    <p class="text-slate-400 uppercase tracking-widest text-sm mt-1 font-semibold">Mbps</p>
                    <p id="status-text" class="text-xs text-blue-400 mt-3 font-medium uppercase tracking-wider">Idle</p>
                </div>
            </div>
            
            <button onclick="startTest()" id="test-btn" class="btn-glow px-14 py-4 rounded-full font-bold text-lg uppercase tracking-wide">
                Start Test
            </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="glass-card p-6 rounded-3xl flex items-center space-x-5">
                <div class="bg-indigo-500/20 p-4 rounded-2xl text-indigo-400 text-2xl">🕒</div>
                <div>
                    <p class="text-[10px] text-slate-400 uppercase font-bold tracking-widest">Ping</p>
                    <p class="text-2xl font-bold text-white"><span id="ping-val">--</span> <span class="text-xs font-normal text-slate-400 uppercase">ms</span></p>
                </div>
            </div>

            <div class="glass-card p-6 rounded-3xl flex items-center space-x-5">
                <div class="bg-blue-500/20 p-4 rounded-2xl text-blue-400 text-2xl">⬇</div>
                <div>
                    <p class="text-[10px] text-slate-400 uppercase font-bold tracking-widest">Download</p>
                    <p class="text-2xl font-bold text-white"><span id="dl-val">--</span> <span class="text-xs font-normal text-slate-400 uppercase">mbps</span></p>
                </div>
            </div>

            <div class="glass-card p-6 rounded-3xl flex items-center space-x-5">
                <div class="bg-emerald-500/20 p-4 rounded-2xl text-emerald-400 text-2xl">⬆</div>
                <div>
                    <p class="text-[10px] text-slate-400 uppercase font-bold tracking-widest">Upload</p>
                    <p class="text-2xl font-bold text-white"><span id="ul-val">--</span> <span class="text-xs font-normal text-slate-400 uppercase">mbps</span></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function startTest() {
            const btn = document.getElementById('test-btn');
            const status = document.getElementById('status-text');
            const circle = document.getElementById('circle');
            
            // Reset and start UI loading state
            btn.disabled = true;
            btn.innerText = "Testing...";
            status.innerText = "Connecting to Server...";
            circle.classList.add('animate-spin-slow');

            try {
                const response = await fetch('/run-test');
                const data = await response.json();

                if (data.status === 'success') {
                    document.getElementById('main-speed').innerText = data.download;
                    document.getElementById('dl-val').innerText = data.download;
                    document.getElementById('ul-val').innerText = data.upload;
                    document.getElementById('ping-val').innerText = data.ping;
                    status.innerText = "Finished";
                } else {
                    status.innerText = "Error: " + data.message;
                    alert("Test failed: " + data.message);
                }
            } catch (error) {
                status.innerText = "Connection Failed";
                console.error(error);
                alert("Could not reach the server. Make sure the backend is running.");
            } finally {
                btn.disabled = false;
                btn.innerText = "Start Test";
                circle.classList.remove('animate-spin-slow');
            }
        }
    </script>
</body>
</html>
